<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Frische Boutique Inventur</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
  --gold:#F5A623; --gold2:#FFD700;
  --green:#16a34a; --green2:#22c55e; --green3:#dcfce7; --green4:#f0fdf4;
  --red:#dc2626; --red2:#ef4444; --red3:#fee2e2;
  --yellow:#d97706; --yellow3:#fef3c7;
  --blue:#2563eb; --blue2:#3b82f6; --blue3:#dbeafe; --blue4:#eff6ff;
  --bg:#f8f9fc; --white:#ffffff;
  --gray50:#f9fafb; --gray100:#f3f4f6; --gray200:#e5e7eb;
  --gray300:#d1d5db; --gray400:#9ca3af; --gray500:#6b7280;
  --gray700:#374151; --gray900:#111827;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
  --r:16px; --r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--gray900);min-height:100vh;padding-bottom:60px;overflow-x:hidden}
button,input{font-family:inherit}

/* HEADER */
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:14px 16px 12px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.header-top{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;color:#111;letter-spacing:.3px;flex-shrink:0;box-shadow:0 0 20px rgba(245,166,35,.4)}
.header-titles{flex:1;min-width:0}
.header-titles h1{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.3px}
.header-sub{font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(255,215,0,.7);letter-spacing:1.5px;margin-top:2px}
.hdr-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-size:10px;font-weight:700;padding:7px 10px;border-radius:8px;cursor:pointer;flex-shrink:0}
.hdr-btn:active{background:rgba(255,255,255,.22)}
.sync-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:8.5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green2);flex-shrink:0}
.sync-dot.off{background:var(--gray400)}
.sync-dot.pending{background:var(--yellow3);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-text{color:rgba(255,255,255,.55)}

/* GENERIC LAYOUT */
.screen{display:none}
.screen.active{display:block}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
.back-btn{background:var(--white);border:1.5px solid var(--gray200);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex-shrink:0;box-shadow:var(--shadow-sm)}
.topbar h2{font-size:16px;font-weight:800}
.topbar .sub{font-size:11px;color:var(--gray500)}

/* MARKET CARDS */
.market-grid{padding:12px}
.market-card{background:var(--white);border:1.5px solid var(--gray200);border-radius:var(--r);padding:18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .15s}
.market-card:active{transform:scale(.98)}
.market-card.full{border-color:rgba(34,197,94,.4);background:linear-gradient(135deg,#f0fdf4,#fff)}
.market-emoji{font-size:26px;width:48px;height:48px;border-radius:12px;background:var(--blue4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.market-info{flex:1;min-width:0}
.market-info h3{font-size:16px;font-weight:800}
.market-info .pct-label{font-size:11px;color:var(--gray500);margin-top:2px;font-family:'JetBrains Mono',monospace}
.mini-ring{width:44px;height:44px;flex-shrink:0;position:relative}
.mini-ring svg{transform:rotate(-90deg)}
.mini-ring .bg{fill:none;stroke:var(--gray200);stroke-width:4}
.mini-ring .fg{fill:none;stroke:var(--blue2);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .4s}
.mini-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;font-family:'JetBrains Mono',monospace}
.chev-right{color:var(--gray300);font-size:16px;flex-shrink:0}

.manager-entry{margin:4px 12px 12px;padding:13px 14px;border-radius:12px;background:#fffbeb;border:1.5px solid rgba(217,119,6,.25);display:flex;align-items:center;gap:10px;cursor:pointer}
.manager-entry .ic{font-size:18px}
.manager-entry .txt{flex:1;font-size:12.5px;color:#78350f;font-weight:600}

/* DEPARTMENT LIST */
.dept-list{padding:4px 12px 20px}
.market-progress{margin:8px 12px 10px;background:var(--white);border:1.5px solid var(--gray200);border-radius:12px;padding:12px 14px}
.market-progress-top{display:flex;justify-content:space-between;font-size:11px;color:var(--gray500);margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.market-progress-track{height:8px;background:var(--gray100);border-radius:99px;overflow:hidden}
.market-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .4s}

.dept-card{background:var(--white);border:1.5px solid var(--gray200);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--shadow-sm)}
.dept-card.full{border-color:rgba(34,197,94,.4);background:linear-gradient(135deg,#f0fdf4,#fff)}
.dept-icon{width:40px;height:40px;border-radius:11px;background:var(--gray100);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.dept-info{flex:1;min-width:0}
.dept-info h4{font-size:14px;font-weight:700}
.dept-info .sub{font-size:10.5px;color:var(--gray400);margin-top:2px}

/* DEPARTMENT DETAIL */
.detail-body{padding:4px 12px 40px}
.name-box{background:var(--white);border:1.5px solid var(--gray200);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.name-box label{font-size:9.5px;font-weight:700;color:var(--gray400);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.name-box input{width:100%;border:1.5px solid var(--gray200);border-radius:8px;padding:9px 10px;font-size:14px}
.name-box input:focus{outline:none;border-color:var(--blue2)}

.info-strip{padding:9px 14px;border-radius:10px;background:var(--blue4);margin-bottom:10px;font-size:11.5px;color:var(--gray700)}
.info-strip b{color:var(--blue)}

.card{background:var(--white);border:1.5px solid var(--gray200);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.card-title-bar{padding:11px 14px;background:var(--gray50);border-bottom:1px solid var(--gray100);font-size:10.5px;font-weight:700;color:var(--gray500);text-transform:uppercase;letter-spacing:.5px;font-family:'JetBrains Mono',monospace;display:flex;justify-content:space-between;align-items:center}

.check-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--gray100);cursor:pointer}
.check-row:last-child{border-bottom:none}
.check-row input{display:none}
.cb{width:22px;height:22px;border-radius:7px;flex-shrink:0;border:2px solid var(--gray300);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .2s;margin-top:1px}
.check-row input:checked ~ .cb{background:var(--green2);border-color:var(--green2);color:#fff}
.check-row input:checked ~ .cl{color:var(--gray400);text-decoration:line-through}
.cl{font-size:12.5px;line-height:1.5;color:var(--gray700);flex:1}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.toggle-row .q{font-size:13px;font-weight:600}
.seg{display:flex;background:var(--gray100);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;color:var(--gray500);cursor:pointer}
.seg button.active{background:var(--white);color:var(--gray900);box-shadow:var(--shadow-sm)}
.seg button.active.yes{color:var(--green)}
.seg button.active.no{color:var(--gray700)}

.zh-table{padding:10px 14px}
.zh-row{display:grid;grid-template-columns:1.2fr 1.4fr .8fr .7fr 28px;gap:6px;margin-bottom:6px}
.zh-row input{border:1.5px solid var(--gray200);border-radius:7px;padding:7px 6px;font-size:11.5px;width:100%;min-width:0}
.zh-row input:focus{outline:none;border-color:var(--blue2)}
.zh-head{font-size:8.5px;color:var(--gray400);text-transform:uppercase;font-family:'JetBrains Mono',monospace;letter-spacing:.3px}
.zh-del{background:var(--red3);color:var(--red);border:none;border-radius:7px;cursor:pointer;font-size:13px}
.zh-add{width:100%;padding:9px;border:1.5px dashed var(--gray300);background:transparent;border-radius:9px;color:var(--gray500);font-size:12px;font-weight:700;cursor:pointer;margin-top:4px}

/* CALCULATOR */
.calc-row{display:grid;grid-template-columns:1.6fr .8fr .7fr .9fr 28px;gap:6px;padding:7px 14px;align-items:center;border-bottom:1px solid var(--gray100)}
.calc-row input,.calc-row select{border:1.5px solid var(--gray200);border-radius:7px;padding:7px 6px;font-size:11.5px;width:100%;min-width:0}
.calc-row .val{font-size:12px;font-weight:700;text-align:right;color:var(--gray700);font-family:'JetBrains Mono',monospace}
.calc-head{display:grid;grid-template-columns:1.6fr .8fr .7fr .9fr 28px;gap:6px;padding:8px 14px;background:var(--gray50);font-size:8px;color:var(--gray400);text-transform:uppercase;font-family:'JetBrains Mono',monospace;border-bottom:1px solid var(--gray100)}
.calc-total{display:flex;justify-content:space-between;padding:12px 14px;font-weight:800;font-size:14px;background:linear-gradient(90deg,var(--gray900),var(--gray700));color:var(--gold2)}
.calc-add{width:calc(100% - 28px);margin:10px 14px;padding:9px;border:1.5px dashed var(--gray300);background:transparent;border-radius:9px;color:var(--gray500);font-size:12px;font-weight:700;cursor:pointer}

/* BOOKING TRACKER */
.book-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--gray100)}
.book-row:last-child{border-bottom:none}
.book-row .lbl{flex:1;font-size:13px;font-weight:700}
.book-row .gb{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--gray400);font-family:'JetBrains Mono',monospace;cursor:pointer}
.book-row .gb-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--gray300);display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.book-row input[type=checkbox]{display:none}
.book-row input[type=checkbox]:checked ~ .gb-box{background:var(--green2);border-color:var(--green2);color:#fff}
.book-row .amt{width:90px;border:1.5px solid var(--gray200);border-radius:7px;padding:6px 7px;font-size:12px;text-align:right}
.book-row .pull{background:var(--blue3);color:var(--blue);border:none;border-radius:6px;font-size:9px;font-weight:700;padding:5px 7px;cursor:pointer;flex-shrink:0}

/* READY / SAVE BAR */
.save-note{text-align:center;font-size:10.5px;color:var(--gray400);padding:8px 0 20px;font-family:'JetBrains Mono',monospace}

/* MANAGER */
.mgr-market-block{margin:0 12px 16px;background:var(--white);border:1.5px solid var(--gray200);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.mgr-head{padding:12px 14px;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:space-between}
.mgr-head h3{color:var(--gold2);font-size:14px;font-weight:800}
.mgr-head .pct{color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.mgr-dept-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--gray100);font-size:12px}
.mgr-dept-row .dot{width:9px;height:9px;border-radius:50%;background:var(--gray300);flex-shrink:0;margin-right:8px}
.mgr-dept-row .dot.ok{background:var(--green2)}
.mgr-dept-row .left{display:flex;align-items:center}
.mgr-dept-row .signer{font-size:10px;color:var(--gray400)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:12px 20px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:var(--shadow);z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.alert-box{margin:0 0 10px;padding:10px 14px;background:#fff5f5;border-top:1px solid rgba(220,38,38,.12);font-size:11px;color:#991b1b;line-height:1.5}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="logo">EDEKA</div>
    <div class="header-titles">
      <h1>Frische Boutique</h1>
      <div class="header-sub" id="hdrSub">INVENTUR · —</div>
    </div>
    <button class="hdr-btn" id="mgrToggleBtn" onclick="App.goManager()">👤 Manager</button>
  </div>
  <div class="sync-row">
    <div class="sync-dot" id="syncDot"></div>
    <div class="sync-text" id="syncText">Bereit</div>
  </div>
</div>

<!-- SCREEN: MARKET PICKER -->
<div class="screen" id="screen-markets">
  <div class="topbar"><div><h2>Markt wählen</h2><div class="sub">Inventur <span id="ymLabelA"></span></div></div></div>
  <div class="market-grid" id="marketGrid"></div>
  <div class="manager-entry" onclick="App.goManager()">
    <div class="ic">👤</div>
    <div class="txt">Manager-Ansicht &amp; Inventur-Freigaben öffnen</div>
    <div class="chev-right">›</div>
  </div>
</div>

<!-- SCREEN: DEPARTMENT LIST -->
<div class="screen" id="screen-depts">
  <div class="topbar">
    <button class="back-btn" onclick="App.goMarkets()">←</button>
    <div><h2 id="deptListTitle">Markt</h2><div class="sub">Abteilung wählen</div></div>
  </div>
  <div class="market-progress">
    <div class="market-progress-top"><span id="mpLabel">0 / 0 erledigt</span><span id="mpPct">0%</span></div>
    <div class="market-progress-track"><div class="market-progress-fill" id="mpFill" style="width:0%"></div></div>
  </div>
  <div class="dept-list" id="deptList"></div>
</div>

<!-- SCREEN: DEPARTMENT DETAIL -->
<div class="screen" id="screen-detail">
  <div class="topbar">
    <button class="back-btn" onclick="App.goDepts()">←</button>
    <div><h2 id="detailTitle">Abteilung</h2><div class="sub" id="detailSub"></div></div>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<!-- SCREEN: MANAGER -->
<div class="screen" id="screen-manager">
  <div class="topbar">
    <button class="back-btn" onclick="App.goMarkets()">←</button>
    <div><h2>Inventur Freigaben</h2><div class="sub">Manager-Ansicht · alle Märkte</div></div>
  </div>
  <div style="padding:0 12px 6px"><button class="hdr-btn" style="background:var(--blue3);color:var(--blue);width:100%;padding:10px" onclick="App.refreshManager()">↻ Live-Status aktualisieren</button></div>
  <div id="managerBody"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   KONFIGURATION
   ════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════ */
const STATE_KEY='inv_state_v2', PRICE_KEY='inv_pricelist_v2', QUEUE_KEY='inv_queue_v2';

function currentYearMonth(){
  const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function emptyDeptState(dept){
  const s={name:'', checked:{}};
  if(dept.type==='fleischerei'){ s.vorinventur=null; s.zh=[]; }
  if(dept.type==='baeckerei'){ s.booking={}; BOOKING_ROWS.forEach(r=>s.booking[r]={gebucht:false, wert:''}); }
  return s;
}

function emptyManagerState(){
  const s={name:'', checked:{}};
  return s;
}

function freshState(){
  const markets={};
  MARKETS.forEach(m=>{
    markets[m.key]={};
    DEPARTMENTS.forEach(d=>{ markets[m.key][d.key]=emptyDeptState(d); });
  });
  const manager={};
  MARKETS.forEach(m=>{ manager[m.key]=emptyManagerState(); });
  return {yearMonth: currentYearMonth(), markets, manager};
}

let STATE = loadState();
let PRICELIST = loadPriceList();
let QUEUE = loadQueue();

function loadState(){
  try{
    const raw=localStorage.getItem(STATE_KEY);
    if(!raw) return freshState();
    const parsed=JSON.parse(raw);
    if(parsed.yearMonth !== currentYearMonth()){
      // Neuer Monat -> automatischer Reset der Checklisten
      return freshState();
    }
    return parsed;
  }catch(e){ return freshState(); }
}
function saveStateLocal(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); }catch(e){} }

function loadPriceList(){
  try{
    const raw=localStorage.getItem(PRICE_KEY);
    if(!raw){
      const pl={}; MARKETS.forEach(m=>pl[m.key]=seedPriceList());
      localStorage.setItem(PRICE_KEY, JSON.stringify(pl));
      return pl;
    }
    return JSON.parse(raw);
  }catch(e){
    const pl={}; MARKETS.forEach(m=>pl[m.key]=seedPriceList()); return pl;
  }
}
function savePriceListLocal(){ try{ localStorage.setItem(PRICE_KEY, JSON.stringify(PRICELIST)); }catch(e){} }

function loadQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } }
function saveQueueLocal(){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(QUEUE)); }catch(e){} }

/* ════════════════════════════════════════════════════════════
   COMPLETION / PERCENT BERECHNUNG
   ════════════════════════════════════════════════════════════ */
function deptCompletion(marketKey, deptKey){
  const dept = DEPARTMENTS.find(d=>d.key===deptKey);
  const s = STATE.markets[marketKey][deptKey];
  let done=0, total=dept.items.length;
  dept.items.forEach((_,i)=>{ if(s.checked[i]) done++; });
  if(dept.type==='fleischerei'){
    total += 1; // Vorinventur-Frage muss beantwortet sein
    if(s.vorinventur!==null) done += 1;
  }
  if(dept.type==='baeckerei'){
    total += BOOKING_ROWS.length*2;
    BOOKING_ROWS.forEach(r=>{
      if(s.booking[r].gebucht) done++;
      if(String(s.booking[r].wert).trim()!=='') done++;
    });
  }
  return {done, total, pct: total?Math.round(done/total*100):0, completed: total>0 && done===total};
}

function managerCompletion(marketKey){
  const s = STATE.manager[marketKey];
  let done=0; const total=MANAGER_ITEMS.length;
  MANAGER_ITEMS.forEach((_,i)=>{ if(s.checked[i]) done++; });
  return {done, total, pct: Math.round(done/total*100), completed: done===total};
}

function marketCompletion(marketKey){
  let done=0, total=0;
  DEPARTMENTS.forEach(d=>{ const c=deptCompletion(marketKey,d.key); done+=c.done; total+=c.total; });
  const mc=managerCompletion(marketKey); done+=mc.done; total+=mc.total;
  return {done, total, pct: total?Math.round(done/total*100):0};
}

/* ════════════════════════════════════════════════════════════
   SYNC (offline-first: lokale Queue -> Apps Script, wenn online)
   ════════════════════════════════════════════════════════════ */
function queueSync(payload){
  QUEUE.push(payload); saveQueueLocal(); updateSyncIndicator(); flushQueue();
}
function updateSyncIndicator(){
  const dot=document.getElementById('syncDot'), txt=document.getElementById('syncText');
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_')===0){
    dot.className='sync-dot off'; txt.textContent='Kein Server verbunden (nur lokal gespeichert)'; return;
  }
  if(QUEUE.length>0){ dot.className='sync-dot pending'; txt.textContent=QUEUE.length+' Änderung(en) werden synchronisiert…'; }
  else if(!navigator.onLine){ dot.className='sync-dot off'; txt.textContent='Offline – wird gespeichert, sobald online'; }
  else { dot.className='sync-dot'; txt.textContent='Synchronisiert'; }
}
async function flushQueue(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_')===0) return;
  if(!navigator.onLine || QUEUE.length===0){ updateSyncIndicator(); return; }
  const item = QUEUE[0];
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // vermeidet CORS-Preflight
      body: JSON.stringify(item)
    });
    const json = await res.json();
    QUEUE.shift(); saveQueueLocal();
    if(json && json.marketCompleted){ showToast('🎉 Markt vollständig – Zusammenfassungs-E-Mail verschickt!'); }
    updateSyncIndicator();
    if(QUEUE.length>0) flushQueue();
  }catch(e){
    updateSyncIndicator(); // bleibt in der Queue, nächster Versuch später
  }
}
window.addEventListener('online', flushQueue);
setInterval(flushQueue, 20000);

function syncDept(marketKey, deptKey){
  const c = deptCompletion(marketKey, deptKey);
  const s = STATE.markets[marketKey][deptKey];
  queueSync({type:'state', yearMonth:STATE.yearMonth, market:marketKey, dept:deptKey,
    name:s.name, percentDone:c.pct, done:c.done, total:c.total, completed:c.completed, data:s});
}
function syncManager(marketKey){
  const c = managerCompletion(marketKey);
  const s = STATE.manager[marketKey];
  queueSync({type:'state', yearMonth:STATE.yearMonth, market:marketKey, dept:'manager',
    name:s.name, percentDone:c.pct, done:c.done, total:c.total, completed:c.completed, data:s});
}
function syncPriceList(marketKey){
  queueSync({type:'pricelist', market:marketKey, items:PRICELIST[marketKey]});
}

async function fetchRemoteState(marketKey){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_')===0) return null;
  try{
    const url = APPS_SCRIPT_URL+'?action=state&yearMonth='+encodeURIComponent(STATE.yearMonth)+'&market='+encodeURIComponent(marketKey);
    const res = await fetch(url);
    const json = await res.json();
    return json.ok ? (json.state[marketKey]||{}) : null;
  }catch(e){ return null; }
}

function categorySum(marketKey, category){
  return PRICELIST[marketKey].filter(r=>r.category===category)
    .reduce((sum,r)=> sum + (parseFloat(r.menge)||0) * (parseFloat(r.preis)||0), 0);
}

function renderCalculator(marketKey){
  const list = PRICELIST[marketKey];
  let total=0;
  let rows = list.map(r=>{
    const val = (parseFloat(r.menge)||0)*(parseFloat(r.preis)||0);
    total += val;
    const opts = BOOKING_ROWS.map(b=>`<option value="${b}" ${r.category===b?'selected':''}>${b}</option>`).join('');
    return `<div class="calc-row">
      <input value="${esc(r.artikel)}" placeholder="Artikel" oninput="App.updateCalcRow('${r.id}','artikel',this.value)">
      <select onchange="App.updateCalcRow('${r.id}','category',this.value)">${opts}</select>
      <input type="number" step="0.01" value="${r.preis}" oninput="App.updateCalcRow('${r.id}','preis',this.value)">
      <input type="number" step="0.01" placeholder="Menge" value="${esc(r.menge)}" oninput="App.updateCalcRow('${r.id}','menge',this.value)">
      <button class="zh-del" onclick="App.delCalcRow('${r.id}')">✕</button>
    </div>`;
  }).join('');
  return `<div class="card"><div class="card-title-bar">VK-Kalkulator (Bäckerei) <span style="font-weight:400;text-transform:none">Menge × Preis</span></div>
    <div class="calc-head"><div>Artikel</div><div>Zeile</div><div>Preis €</div><div>Menge</div><div></div></div>
    ${rows}
    <button class="calc-add" onclick="App.addCalcRow()">+ Artikel hinzufügen</button>
    <div class="calc-total"><span>Gesamt-VK-Preis</span><span>${total.toFixed(2)} €</span></div>
  </div>`;
}

function renderBookingTracker(marketKey, s){
  let rows = BOOKING_ROWS.map(r=>{
    const b = s.booking[r];
    const canPull = AUTO_CATEGORIES.includes(r) || PRICELIST[marketKey].some(p=>p.category===r);
    return `<div class="book-row">
      <label class="gb" onclick="event.preventDefault();App.toggleBookingGebucht('${r}')">
        <input type="checkbox" ${b.gebucht?'checked':''}><div class="gb-box">✓</div>Gebucht?
      </label>
      <div class="lbl">${BOOKING_LABELS[r]}</div>
      ${canPull?`<button class="pull" onclick="App.pullIntoBooking('${r}')">↺ aus Kalkulator</button>`:''}
      <input class="amt" type="number" step="0.01" placeholder="VK €" value="${esc(b.wert)}" oninput="App.setBookingWert('${r}', this.value)">
    </div>`;
  }).join('');
  return `<div class="card"><div class="card-title-bar">Buchungs-Tracker</div>${rows}</div>`;
}

/* INIT */
App.init();
</script>
</body>
</html>
